[project]
name = "animal-movement-fm"
version = "0.1.0"
description = "Benchmarking deep learning architectures for animal movement prediction across species and ecological domains."
authors = [{ name = "Jack Jenkins" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies for the baseline sprint.
# Heavier deps (cartopy, geopandas, xarray) deliberately deferred — add them
# when the relevant pipeline stage starts. Lean dependency tree = fewer
# install headaches on NCI later.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",       # parquet I/O
    "scipy>=1.13",         # stats, special functions (von Mises etc.)
    "scikit-learn>=1.4",   # split utilities, metrics scaffolding
    "statsmodels>=0.14",   # ARIMA baseline
    "xgboost>=2.0",        # XGBoost baseline
    "torch==2.5.1",        # LSTM/transformer; pinned; Gadi's V100 (CC 7.0/Volta) needs a CUDA 12.x build; the latest torch uses CUDA 13, which dropped Volta.
    "matplotlib>=3.8",     # plots
    "seaborn>=0.13",       # plots
    "pyyaml>=6.0",         # config files
    "tqdm>=4.66",          # progress bars
    "duckdb>=1.5.4",
    "netcdf4>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",           # linter + formatter (replaces black + flake8 + isort)
    "ipykernel>=6.29",     # jupyter kernel for notebooks
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal_movement_fm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern syntax)
]
ignore = [
    "E501", # line too long (formatter handles this)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# On Linux (i.e. Gadi), pull torch from PyTorch's CUDA 12.1 wheel index so we get a
# Volta-compatible (V100 / CC 7.0) build. On macOS this source doesn't apply, so uv
# falls back to PyPI and installs the normal CPU/MPS torch for local development.
[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
